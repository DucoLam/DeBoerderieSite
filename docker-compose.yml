version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: de-boerderie-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/de_boerderie
      - SECRET_KEY=your-secret-key-here
      - DEBUG=False
    depends_on:
      - db
    volumes:
      - ./backend:/app/backend
    command: uv run uvicorn app.main:main --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: de-boerderie-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app/frontend
    command: npm run dev -- --host 0.0.0.0

  db:
    image: postgres:16-alpine
    container_name: de-boerderie-db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=de_boerderie
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
